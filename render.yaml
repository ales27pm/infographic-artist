services:
  - type: web
    name: infographic-artist-chatgpt
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        value: https://chatgpt.com,https://platform.openai.com
      - key: CORS_ALLOW_ORIGINS
        value: https://chatgpt.com,https://platform.openai.com
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false
