<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Infographic Artist</title>
<style>
:root{color-scheme:light dark;--bg:#f2efe6;--panel:#fbf9f2;--ink:#151712;--muted:#666b61;--line:#1b1e1724;--accent:#ff6238;--acid:#c9ff39;--blue:#586cff;--dark:#141611;--good:#2f8a57;--warn:#d58a18;--bad:#c94638}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.48 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{padding:0}.app{min-height:360px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}.mark{width:32px;height:32px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;transform:rotate(-13deg);background:conic-gradient(from 20deg,var(--acid),var(--accent),var(--blue),var(--acid))}.mark:after{content:"";width:12px;height:12px;background:var(--dark);border-radius:2px}.badge{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:8px 11px;cursor:pointer;font-weight:650}.btn:hover{background:var(--dark);color:var(--bg)}.wrap{padding:22px;max-width:1180px;margin:auto}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:850;color:var(--muted)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.04em;margin:.25em 0}h1{font-size:clamp(37px,7vw,78px);line-height:.88}h2{font-size:clamp(28px,5vw,52px);line-height:.95}h3{font-size:24px;line-height:1.03}.lead{max-width:760px;color:var(--muted);font-size:15px}.scoreball{aspect-ratio:1;max-width:190px;justify-self:end;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--panel),transparent 52%),conic-gradient(var(--acid),var(--accent),var(--blue),var(--acid));box-shadow:inset 0 0 0 18px color-mix(in srgb,var(--bg) 85%,transparent)}.scoreball b{font:50px Georgia;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:18px 0 24px}.stat{padding:14px 12px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font:28px Georgia}.meta{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:260px;padding:18px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 84%,transparent)}.card:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-55px;top:-60px;background:var(--card-accent,var(--acid));opacity:.42}.card>*{position:relative}.card h3{margin-top:28px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:4px 7px}.card .footer{margin-top:auto;display:flex;gap:7px}.card .footer .btn{flex:1}.notice{padding:14px 16px;border-left:4px solid var(--accent);border-radius:4px 12px 12px 4px;background:color-mix(in srgb,var(--panel) 82%,transparent);margin:12px 0}.section{margin:24px 0}.section-title{display:flex;align-items:end;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:8px}.list{display:grid;gap:8px;padding:0;list-style:none}.list li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 70%,transparent)}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.matrix{overflow:auto;border:1px solid var(--line);border-radius:16px}.matrix table{width:100%;border-collapse:collapse;min-width:700px}.matrix th,.matrix td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}.matrix th{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.graphbox{height:530px;border:1px solid var(--line);border-radius:20px;background:var(--dark);overflow:hidden;position:relative}.graphbox svg{width:100%;height:100%;display:block}.graph-label{font-size:11px;fill:#f6f2e8;paint-order:stroke;stroke:#141611;stroke-width:3px;stroke-linejoin:round}.graph-node{cursor:pointer;transition:.15s}.graph-node:hover{r:9}.route-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.route{padding:18px;border-radius:19px;border:1px solid var(--line);background:var(--panel)}.route:nth-child(1){border-top:8px solid var(--acid)}.route:nth-child(2){border-top:8px solid var(--accent)}.route:nth-child(3){border-top:8px solid var(--blue)}.bars{display:grid;gap:12px}.axis{display:grid;grid-template-columns:180px 1fr 48px;gap:10px;align-items:center}.track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--acid))}.gauge{height:22px;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));position:relative}.gauge i{position:absolute;top:-5px;width:4px;height:32px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}.coach{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.coach-panel{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.sources a{color:var(--blue);word-break:break-word}.empty{display:grid;place-items:center;text-align:center;min-height:360px;border:1px dashed var(--line);border-radius:20px;padding:30px}.empty .mark{width:64px;height:64px;margin:auto}.spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.grid,.route-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.scoreball{justify-self:start;max-width:120px}.stats{grid-template-columns:repeat(2,1fr)}.compare,.coach{grid-template-columns:1fr}.axis{grid-template-columns:125px 1fr 42px}}
@media(max-width:560px){.wrap{padding:15px}.top{padding:11px 13px}.brand span:last-child{display:none}.grid,.route-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.actions .btn:nth-child(2){display:none}}
@media(prefers-color-scheme:dark){:root{--bg:#171914;--panel:#20231c;--ink:#f2efe6;--muted:#b0b5a9;--line:#f2efe625;--dark:#0d0f0b}.scoreball b{color:#151712}.card:before{opacity:.25}.sources a{color:#aeb9ff}}
</style>
</head>
<body><script>window.__INFOGRAPHIC_DEMO__={"view": "directions", "data": {"brief": {"name": "Atelier Boréal", "sector": "architecture durable", "promise": "rendre la précision constructive humaine et crédible", "audience": "propriétaires et municipalités", "traits": ["précise", "humaine", "durable"], "must_avoid": ["montagnes", "toits de maison"], "risk_tolerance": "audacieuse mais institutionnelle"}, "routes": [{"id": "symbol", "name": "Signal autonome", "thesis": "Pour Atelier Boréal, rendre « rendre la précision constructive humaine et crédible » visible par un symbole compact conçu d’abord en silhouette monochrome, puis relié au nom par une règle de proportion stable.", "architecture": "Un symbole compact conçu d’abord en silhouette monochrome, puis relié au nom par une règle de proportion stable.", "geometry": "Une masse primaire, une tension directionnelle et une contreforme utile. Éviter les détails décoratifs avant 24 px.", "typography": "Mot-signe calme et distinct, sans chercher à répéter littéralement la forme du symbole.", "palette_logic": "Commencer en noir et blanc; ajouter une couleur fonctionnelle liée à la promesse, puis vérifier le contraste et la reproduction.", "assets": ["symbole", "mot-signe", "micro-icône", "règles de réduction"], "stress_tests": ["12/24/48 px", "monochrome", "flou 3 px", "découpe", "rappel après 2 secondes"], "traits_to_express": ["précise", "humaine", "durable"], "must_avoid": ["montagnes", "toits de maison"], "precedents": [{"id": "iittala", "name": "Iittala", "principle_only": "Commencer par la topologie et les rapports de masse, puis seulement ajuster la finition et la couleur."}, {"id": "target-bullseye", "name": "Target Bullseye", "principle_only": "cohérence nom-signe"}], "transferable_principles": ["Commencer par la topologie et les rapports de masse, puis seulement ajuster la finition et la couleur.", "extraire un mécanisme, jamais une surface graphique", "cohérence nom-signe", "forme utilisable comme dispositif"], "anti_copy_rule": "Ne pas emprunter la silhouette, la construction des lettres, la combinaison chromatique, le dispositif d’espace négatif ou la composition du précédent. Redériver chaque forme depuis ce brief.", "fit": {"audience": "propriétaires et municipalités", "risk_tolerance": "audacieuse mais institutionnelle", "sector": "architecture durable"}}, {"id": "type", "name": "Rythme typographique propriétaire", "thesis": "Pour Atelier Boréal, rendre « rendre la précision constructive humaine et crédible » visible par le nom devient l’actif principal grâce à une anomalie locale, un rythme ou une modulation issue de la promesse.", "architecture": "Le nom devient l’actif principal grâce à une anomalie locale, un rythme ou une modulation issue de la promesse.", "geometry": "Construire les intervalles, ligatures et contreformes sur une grille; limiter l’idée distinctive à un geste répétable.", "typography": "Dessin ou modification ciblée plutôt qu’une police spectaculaire non gouvernée.", "palette_logic": "Commencer en noir et blanc; ajouter une couleur fonctionnelle liée à la promesse, puis vérifier le contraste et la reproduction.", "assets": ["mot-signe", "monogramme", "alphabet secondaire", "motif dérivé"], "stress_tests": ["lecture immédiate", "gravure", "petite taille", "langues secondaires", "animation de construction"], "traits_to_express": ["précise", "humaine", "durable"], "must_avoid": ["montagnes", "toits de maison"], "precedents": [{"id": "cloudflare", "name": "Cloudflare", "principle_only": "Dériver une règle générative du mandat, puis verrouiller ses invariants avant de multiplier les variantes."}, {"id": "wetransfer", "name": "WeTransfer", "principle_only": "Dériver une règle générative du mandat, puis verrouiller ses invariants avant de multiplier les variantes."}], "transferable_principles": ["Dériver une règle générative du mandat, puis verrouiller ses invariants avant de multiplier les variantes.", "extraire un mécanisme, jamais une surface graphique"], "anti_copy_rule": "Ne pas emprunter la silhouette, la construction des lettres, la combinaison chromatique, le dispositif d’espace négatif ou la composition du précédent. Redériver chaque forme depuis ce brief.", "fit": {"audience": "propriétaires et municipalités", "risk_tolerance": "audacieuse mais institutionnelle", "sector": "architecture durable"}}, {"id": "system", "name": "Champ vivant gouverné", "thesis": "Pour Atelier Boréal, rendre « rendre la précision constructive humaine et crédible » visible par une grammaire stable génère plusieurs compositions, icônes ou cadres sans figer la marque dans une seule image.", "architecture": "Une grammaire stable génère plusieurs compositions, icônes ou cadres sans figer la marque dans une seule image.", "geometry": "Définir des invariants mesurables — grille, module, angle, densité et zone de repos — avant les variations.", "typography": "Typographie fonctionnelle servant d’ancrage pendant que le champ visuel varie.", "palette_logic": "Commencer en noir et blanc; ajouter une couleur fonctionnelle liée à la promesse, puis vérifier le contraste et la reproduction.", "assets": ["grille", "règles de variation", "bibliothèque de modules", "motion", "gabarits"], "stress_tests": ["10 variantes cohérentes", "signalétique", "motion 2 secondes", "supports étroits", "version statique"], "traits_to_express": ["précise", "humaine", "durable"], "must_avoid": ["montagnes", "toits de maison"], "precedents": [{"id": "laneige", "name": "Laneige", "principle_only": "Dériver une règle générative du mandat, puis verrouiller ses invariants avant de multiplier les variantes."}, {"id": "elastic", "name": "Elastic", "principle_only": "Dériver une règle générative du mandat, puis verrouiller ses invariants avant de multiplier les variantes."}], "transferable_principles": ["Dériver une règle générative du mandat, puis verrouiller ses invariants avant de multiplier les variantes.", "extraire un mécanisme, jamais une surface graphique"], "anti_copy_rule": "Ne pas emprunter la silhouette, la construction des lettres, la combinaison chromatique, le dispositif d’espace négatif ou la composition du précédent. Redériver chaque forme depuis ce brief.", "fit": {"audience": "propriétaires et municipalités", "risk_tolerance": "audacieuse mais institutionnelle", "sector": "architecture durable"}}], "decision_rule": "Prototyper les trois routes en monochrome avant d’en choisir une. Retenir celle dont la structure — et non la finition — rend la promesse la plus facile à percevoir et la plus difficile à confondre."}};</script>
<div class="app">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span><span>Infographic Artist</span><span class="badge" id="viewBadge">workspace</span></div><div class="actions"><button class="btn" id="newSearch">Atlas</button><button class="btn" id="fullscreen">Agrandir</button></div></header>
<main class="wrap" id="root"><section class="empty"><div><div class="mark"></div><h2>Le mécanisme, pas le pastiche.</h2><p class="lead">Demande à ChatGPT d’ouvrir l’atlas, de comparer des systèmes, d’analyser une proposition ou de générer trois directions originales.</p></div></section></main>
</div>
<script>
(() => {
  const root = document.getElementById('root');
  const badge = document.getElementById('viewBadge');
  const palette = ['#c9ff39','#ff6238','#586cff','#e6c94d','#7fd1b9','#e98bd1'];
  let current = null;
  const esc = (v='') => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const arr = v => Array.isArray(v) ? v : [];
  const pct = v => Math.max(0, Math.min(100, Number(v)||0));
  const pill = v => `<span class="tag">${esc(v)}</span>`;
  const list = (items, empty='Aucun élément') => arr(items).length ? `<ul class="list">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>` : `<p class="meta">${esc(empty)}</p>`;
  const titleBlock = (eyebrow,title,lead='') => `<section class="hero"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${lead?`<p class="lead">${esc(lead)}</p>`:''}</div></section>`;
  const sourceLinks = sources => arr(sources).length ? `<div class="sources">${arr(sources).map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a>${s.kind?` <span class="meta">· ${esc(s.kind)}</span>`:''}</p>`).join('')}</div>` : '<p class="meta">Aucune source détaillée sur cette fiche index.</p>';

  async function callTool(name,args){
    try{
      if(window.openai?.callTool) return await window.openai.callTool(name,args);
      if(window.openai?.app?.callServerTool) return await window.openai.app.callServerTool({name,arguments:args});
    }catch(err){ showError(err); return null; }
    const prompt = name==='get_brand_case' ? `Ouvre la fiche de marque ${args.item_id} dans Infographic Artist.` : `Utilise Infographic Artist avec l’outil ${name}.`;
    try{
      if(window.openai?.sendFollowUpMessage) return await window.openai.sendFollowUpMessage({prompt});
      if(window.openai?.app?.sendMessage) return await window.openai.app.sendMessage({role:'user',content:[{type:'text',text:prompt}]});
    }catch(err){ showError(err); }
    return null;
  }
  function showError(err){root.innerHTML=`<section class="empty error"><div><h2>Analyse interrompue</h2><p>${esc(err?.message||err)}</p></div></section>`;}
  function setLoading(label='Analyse en cours'){root.innerHTML=`<section class="empty"><div><div class="spinner"></div><h2>${esc(label)}</h2></div></section>`;}

  function renderAtlas(d){
    const s=d.summary||{}; const items=arr(d.items);
    root.innerHTML = titleBlock('Atlas interrogeable', d.query?`Résultats · ${d.query}`:'934 identités iconiques', `${d.total_matches ?? items.length} correspondances. Les 64 monographies profondes sont distinguées des fiches d’index.`)+
      `<section class="stats"><div class="stat"><b>${esc(s.brand_count||934)}</b>identités</div><div class="stat"><b>${esc(s.deep_case_count||64)}</b>monographies</div><div class="stat"><b>${esc(s.library_count||105)}</b>systèmes</div><div class="stat"><b>${esc(s.graph_nodes||159)}</b>nœuds</div></section>`+
      `<section class="grid">${items.map((x,i)=>`<article class="card" style="--card-accent:${palette[i%palette.length]}"><div class="eyebrow">${esc(x.region)} · ${esc(x.depth)}</div><h3>${esc(x.name)}</h3><p class="meta">${esc(x.organization||x.category)}${x.year?` · ${esc(x.year)}`:''}</p><p>${esc(x.lesson||x.why_iconic)}</p><div class="tags">${[x.system_pattern,x.primary_mechanism,x.evidence].filter(Boolean).map(pill).join('')}</div><div class="footer"><button class="btn open-case" data-id="${esc(x.id)}">Ouvrir</button></div></article>`).join('')}</section>`;
    document.querySelectorAll('.open-case').forEach(b=>b.addEventListener('click',()=>{setLoading('Ouverture de la fiche');callTool('get_brand_case',{item_id:b.dataset.id});}));
  }
  function renderCase(d){
    root.innerHTML=titleBlock(`${d.region||''} · ${d.evidence||''}`,d.name,d.why_iconic||d.lesson)+
      `<div class="notice"><strong>Frontière anti-copie.</strong> ${esc(d.do_not_copy||'Re-dériver la forme depuis le brief.')}</div>`+
      `<section class="compare"><article class="card"><div class="eyebrow">Mécanisme</div><h3>${esc(d.primary_mechanism||d.system_pattern)}</h3><p>${esc(d.visual_mechanism||d.lesson)}</p><div class="tags">${[d.category,d.archetype,d.system_pattern].filter(Boolean).map(pill).join('')}</div></article><article class="card"><div class="eyebrow">Contexte</div><h3>${esc(d.organization||d.name)}</h3><p>${esc(d.year||'Date à vérifier')}</p><p>${arr(d.designers).map(esc).join(', ')||'Attribution non détaillée'}</p><p class="meta">Sensibilité juridique : ${esc(d.legal_sensitivity||'standard')}</p></article></section>`+
      `<section class="section"><div class="section-title"><h2>Principes transférables</h2></div>${list(d.principles)}</section>`+
      `<section class="compare"><div><h2>Base de reconnaissance</h2>${list(d.recognition_basis)}</div><div><h2>Tests de résistance</h2>${list(d.stress_tests)}</div></section>`+
      `<section class="section"><div class="section-title"><h2>Sources</h2></div>${sourceLinks(d.sources)}</section>`;
  }
  function renderComparison(d){
    const cases=arr(d.cases);
    root.innerHTML=titleBlock('Lecture croisée',`${cases.length} systèmes comparés`,d.synthesis)+
      `<div class="notice"><strong>Règle.</strong> Transférer la logique partagée seulement après avoir changé silhouette, topologie, typographie, comportement chromatique et composition.</div>`+
      `<section class="matrix"><table><thead><tr><th>Identité</th><th>Pattern</th><th>Mécanisme</th><th>Principes</th><th>Collision</th><th>Tests</th></tr></thead><tbody>${cases.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.pattern)}</td><td>${esc(c.mechanism)}</td><td>${arr(c.principles).map(esc).join('<br>')}</td><td>${esc(c.collision_boundary)}</td><td>${arr(c.stress_tests).map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></section>`+
      `<section class="compare"><article class="card"><h3>Patrons partagés</h3>${list(d.shared_patterns)}</article><article class="card"><h3>Mécanismes partagés</h3>${list(d.shared_mechanisms)}</article></section>`;
  }
  function renderGraph(d){
    const nodes=arr(d.nodes), edges=arr(d.edges), byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
    const W=1000,H=560,pad=42;
    const xy=n=>({x:pad+(Number(n.x)||.5)*(W-pad*2),y:pad+(Number(n.y)||.5)*(H-pad*2)});
    const lines=edges.map(e=>{const a=byId[e.source],b=byId[e.target]; if(!a||!b)return '';const A=xy(a),B=xy(b);return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#f2efe626" stroke-width="1"/>`;}).join('');
    const dots=nodes.map((n,i)=>{const p=xy(n),r=Math.max(4,Math.min(12,4+(Number(n.degree)||0)/6));return `<g><circle class="graph-node" cx="${p.x}" cy="${p.y}" r="${r}" fill="${palette[i%palette.length]}" data-label="${esc(n.label)}"><title>${esc(n.label)} · ${esc(n.type)}</title></circle><text class="graph-label" x="${p.x+r+4}" y="${p.y+4}">${esc(String(n.label).slice(0,28))}</text></g>`;}).join('');
    root.innerHTML=titleBlock('Knowledge graph',d.query?`Réseau · ${d.query}`:'Mécanismes et systèmes',`${d.meta?.node_count||nodes.length} nœuds · ${d.meta?.edge_count||edges.length} relations`)+`<section class="graphbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphe des systèmes de marque">${lines}${dots}</svg></section><p class="meta">Le graphe montre des relations abstraites et des précédents de méthode; il ne contient aucun artwork de tiers.</p>`;
  }
  function renderLibrary(d){
    root.innerHTML=titleBlock('Bibliothèque de systèmes',d.query?`Méthodes · ${d.query}`:'Studios, manuels et écoles',`${d.total_matches||arr(d.items).length} correspondances`)+`<section class="grid">${arr(d.items).map((x,i)=>`<article class="card" style="--card-accent:${palette[i%palette.length]}"><div class="eyebrow">${esc(x.kind)} · ${esc(x.region)}</div><h3>${esc(x.name)}</h3><p class="meta">${esc(x.era)}</p><div class="tags">${arr(x.focus).map(pill).join('')}</div><p><strong>Principes</strong><br>${arr(x.principles).map(esc).join(' · ')}</p><p class="meta">${arr(x.signature_projects).map(esc).join(' · ')}</p></article>`).join('')}</section>`;
  }
  function renderDirections(d){
    const b=d.brief||{};
    root.innerHTML=titleBlock('Brief → système',b.name||'Directions originales',`${b.sector||''} · ${b.promise||''}`)+`<div class="notice"><strong>Décision.</strong> ${esc(d.decision_rule)}</div><section class="route-grid">${arr(d.routes).map(r=>`<article class="route"><div class="eyebrow">Route ${esc(r.id)}</div><h3>${esc(r.name)}</h3><p><strong>${esc(r.thesis)}</strong></p><p>${esc(r.architecture)}</p><h4>Géométrie</h4><p>${esc(r.geometry)}</p><h4>Typographie</h4><p>${esc(r.typography)}</p><h4>Actifs</h4><div class="tags">${arr(r.assets).map(pill).join('')}</div><h4>Tests</h4>${list(r.stress_tests)}<div class="notice"><strong>Anti-copie.</strong> ${esc(r.anti_copy_rule)}</div><p class="meta">Précédents de principe : ${arr(r.precedents).map(p=>esc(p.name)).join(' · ')||'aucun'}</p></article>`).join('')}</section>`;
  }
  function renderCritique(d){
    const axes=Object.values(d.axes||{});
    root.innerHTML=titleBlock('Critique sur 100',`${d.score} · grade ${d.grade}`,d.context||'Mesures techniques et jugement graphique combinés.')+`<section class="bars">${axes.map(a=>`<div class="axis"><strong>${esc(a.label)}</strong><div class="track"><div class="fill" style="width:${pct((a.score/20)*100)}%"></div></div><b>${esc(a.score)}/20</b></div>`).join('')}</section><section class="section"><div class="section-title"><h2>Actions prioritaires</h2></div>${list(d.priority_actions)}</section>${d.reference_comparison?similarityBlock(d.reference_comparison):''}<div class="notice"><strong>Limite.</strong> ${esc(d.method_note)}</div>`;
  }
  function similarityBlock(d){return `<section class="section"><div class="section-title"><h2>Risque perceptuel · ${esc(d.risk_band)}</h2><strong>${esc(d.risk_score)}/100</strong></div><div class="gauge"><i style="left:${pct(d.risk_score)}%"></i></div><div class="grid" style="margin-top:12px">${Object.entries(d.components||{}).map(([k,v])=>`<article class="card" style="min-height:130px"><div class="eyebrow">${esc(k.replaceAll('_',' '))}</div><h3>${esc(v)}%</h3></article>`).join('')}</div><h3>Transformations structurelles</h3>${list(d.recommended_transformations)}<div class="notice"><strong>Juridique.</strong> ${esc(d.legal_note)}</div></section>`;}
  function renderSimilarity(d){root.innerHTML=titleBlock('Triage de similarité',`${d.risk_score}/100 · ${d.risk_band}`,'La proximité visuelle est décomposée pour montrer où agir, au lieu de fournir un verdict opaque.')+similarityBlock(d);}
  function renderCoach(d){root.innerHTML=titleBlock('Mode coach','Une décision falsifiable',d.diagnosis)+`<section class="coach"><article class="coach-panel"><div class="eyebrow">Pourquoi</div><h3>${esc(d.goal)}</h3><p>${esc(d.why)}</p><div class="notice"><strong>Règle de coach.</strong> ${esc(d.coach_rule)}</div></article><article class="coach-panel"><div class="eyebrow">Exercice · ${esc(d.exercise?.duration)}</div><h3>${esc(d.question)}</h3>${list(d.exercise?.steps)}<h3>Critères d’acceptation</h3>${list(d.acceptance_criteria)}</article></section>`;}
  function render(payload){
    current=payload; const view=payload?.view||'workspace'; const d=payload?.data||{}; badge.textContent=view;
    const f={atlas:renderAtlas,case:renderCase,comparison:renderComparison,graph:renderGraph,library:renderLibrary,directions:renderDirections,critique:renderCritique,similarity:renderSimilarity,coach:renderCoach}[view];
    if(f) f(d); else root.innerHTML=`<section class="empty"><div><h2>Résultat reçu</h2><pre>${esc(JSON.stringify(payload,null,2))}</pre></div></section>`;
  }
  function extract(x){
    if(!x)return null;
    if(x.view&&x.data)return x;
    if(x.structuredContent?.view)return x.structuredContent;
    if(x.toolOutput?.view)return x.toolOutput;
    if(x.result?.structuredContent?.view)return x.result.structuredContent;
    if(x.params?.structuredContent?.view)return x.params.structuredContent;
    if(x.params?.result?.structuredContent?.view)return x.params.result.structuredContent;
    return null;
  }
  function accept(x){const p=extract(x);if(p)render(p);}
  window.addEventListener('message',e=>{const d=e.data;if(d?.method==='ui/notifications/tool-result'||d?.method==='openai:set_globals'||d?.type==='openai:set_globals')accept(d);});
  window.addEventListener('openai:set_globals',e=>accept(e.detail));
  document.getElementById('newSearch').addEventListener('click',()=>callTool('open_brand_atlas',{query:'',limit:12}));
  document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(window.openai?.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'});else if(window.openai?.app?.requestDisplayMode)await window.openai.app.requestDisplayMode({mode:'fullscreen'});}catch(_){}});
  const initial = extract(window.__INFOGRAPHIC_DEMO__) || extract(window.openai) || extract(window.openai?.toolOutput) || extract(window.openai?.toolResult);
  if(initial) render(initial);
})();
</script>
</body>
</html>
