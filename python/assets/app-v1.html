<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Infographic Artist</title>
<style>
:root{color-scheme:light dark;--bg:#f2efe6;--panel:#fbf9f2;--ink:#151712;--muted:#666b61;--line:#1b1e1724;--accent:#ff6238;--acid:#c9ff39;--blue:#586cff;--dark:#141611;--good:#2f8a57;--warn:#d58a18;--bad:#c94638}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.48 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{padding:0}.app{min-height:360px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}.mark{width:32px;height:32px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;transform:rotate(-13deg);background:conic-gradient(from 20deg,var(--acid),var(--accent),var(--blue),var(--acid))}.mark:after{content:"";width:12px;height:12px;background:var(--dark);border-radius:2px}.badge{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:8px 11px;cursor:pointer;font-weight:650}.btn:hover{background:var(--dark);color:var(--bg)}.wrap{padding:22px;max-width:1180px;margin:auto}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:850;color:var(--muted)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.04em;margin:.25em 0}h1{font-size:clamp(37px,7vw,78px);line-height:.88}h2{font-size:clamp(28px,5vw,52px);line-height:.95}h3{font-size:24px;line-height:1.03}.lead{max-width:760px;color:var(--muted);font-size:15px}.scoreball{aspect-ratio:1;max-width:190px;justify-self:end;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--panel),transparent 52%),conic-gradient(var(--acid),var(--accent),var(--blue),var(--acid));box-shadow:inset 0 0 0 18px color-mix(in srgb,var(--bg) 85%,transparent)}.scoreball b{font:50px Georgia;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:18px 0 24px}.stat{padding:14px 12px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font:28px Georgia}.meta{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:260px;padding:18px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 84%,transparent)}.card:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-55px;top:-60px;background:var(--card-accent,var(--acid));opacity:.42}.card>*{position:relative}.card h3{margin-top:28px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:4px 7px}.card .footer{margin-top:auto;display:flex;gap:7px}.card .footer .btn{flex:1}.notice{padding:14px 16px;border-left:4px solid var(--accent);border-radius:4px 12px 12px 4px;background:color-mix(in srgb,var(--panel) 82%,transparent);margin:12px 0}.section{margin:24px 0}.section-title{display:flex;align-items:end;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:8px}.list{display:grid;gap:8px;padding:0;list-style:none}.list li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 70%,transparent)}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.matrix{overflow:auto;border:1px solid var(--line);border-radius:16px}.matrix table{width:100%;border-collapse:collapse;min-width:700px}.matrix th,.matrix td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}.matrix th{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.graphbox{height:530px;border:1px solid var(--line);border-radius:20px;background:var(--dark);overflow:hidden;position:relative}.graphbox svg{width:100%;height:100%;display:block}.graph-label{font-size:11px;fill:#f6f2e8;paint-order:stroke;stroke:#141611;stroke-width:3px;stroke-linejoin:round}.graph-node{cursor:pointer;transition:.15s}.graph-node:hover{r:9}.route-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.route{padding:18px;border-radius:19px;border:1px solid var(--line);background:var(--panel)}.route:nth-child(1){border-top:8px solid var(--acid)}.route:nth-child(2){border-top:8px solid var(--accent)}.route:nth-child(3){border-top:8px solid var(--blue)}.bars{display:grid;gap:12px}.axis{display:grid;grid-template-columns:180px 1fr 48px;gap:10px;align-items:center}.track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--acid))}.gauge{height:22px;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));position:relative}.gauge i{position:absolute;top:-5px;width:4px;height:32px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}.coach{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.coach-panel{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.prompt{white-space:pre-wrap;word-break:break-word;margin:8px 0 12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--bg) 68%,var(--panel));font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sources a{color:var(--blue);word-break:break-word}.empty{display:grid;place-items:center;text-align:center;min-height:360px;border:1px dashed var(--line);border-radius:20px;padding:30px}.empty .mark{width:64px;height:64px;margin:auto}.spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.grid,.route-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.scoreball{justify-self:start;max-width:120px}.stats{grid-template-columns:repeat(2,1fr)}.compare,.coach{grid-template-columns:1fr}.axis{grid-template-columns:125px 1fr 42px}}
@media(max-width:560px){.wrap{padding:15px}.top{padding:11px 13px}.brand span:last-child{display:none}.grid,.route-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.actions #fullscreen{display:none}}
@media(prefers-color-scheme:dark){:root{--bg:#171914;--panel:#20231c;--ink:#f2efe6;--muted:#b0b5a9;--line:#f2efe625;--dark:#0d0f0b}.scoreball b{color:#151712}.card:before{opacity:.25}.sources a{color:#aeb9ff}}
.axis-unavailable{grid-column:2/-1;min-width:0;overflow-wrap:anywhere}.axis>strong{overflow-wrap:anywhere}
</style>
<style>
.status-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:760}.status-pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}.status-pill[data-status="succeeded"]:before{background:var(--good)}.status-pill[data-status="failed"]:before{background:var(--bad)}.asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.asset{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.asset img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg)}.asset-body{padding:12px}.job-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.job-meta .stat{border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 76%,transparent)}@media(max-width:850px){.asset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.job-meta{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.asset-grid,.job-meta{grid-template-columns:1fr}}
.workflow-stages{list-style:none;padding:0;display:grid;gap:10px}
.workflow-stage{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow-wrap:anywhere}
.workflow-stage summary{display:flex;gap:12px;align-items:center;padding:16px;cursor:pointer;font-weight:700}
.workflow-stage summary>span:nth-child(2){flex:1;min-width:0}
.workflow-number{flex:0 0 28px;display:grid;place-items:center;aspect-ratio:1;border:1px solid var(--line);border-radius:50%}
.workflow-body{padding:0 18px 18px}.workflow-body h3{font:700 14px/1.5 inherit;margin-top:18px}
.workflow-outcomes .card{min-height:170px}.workflow-outcomes h3{margin-top:12px}
.principle-search{margin:20px 0}.principle-search label{display:block;font-weight:650;margin-bottom:8px}
.principle-search>div{display:flex;gap:8px}.principle-search input{min-width:0;flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.principle-card{overflow-wrap:anywhere}.principle-card details{margin-top:auto}.principle-card summary{cursor:pointer;font-weight:700}
:where(summary,input,button,a):focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:560px){.workflow-stage summary{gap:8px;padding:12px;flex-wrap:wrap}.workflow-stage summary>.tag{margin-left:36px}.workflow-body{padding:0 12px 12px}.workflow-body .list li{padding:8px}.workflow-outcomes .card{min-height:140px}}
.workflow-brief{margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow-wrap:anywhere}
.workflow-brief h3{margin:0 0 12px}.workflow-brief dl{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:8px 14px;margin:0}.workflow-brief dt{font-weight:700}.workflow-brief dd{margin:0;min-width:0}
.principle-card .sources{display:block}.principle-card .sources p{margin:8px 0}
@media(max-width:560px){.top{gap:10px;flex-wrap:wrap}.top>.actions{margin-left:auto;flex-shrink:0}.workflow-brief dl{grid-template-columns:1fr;gap:4px}.workflow-brief dd{margin-bottom:8px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span><span>Infographic Artist</span><span class="badge" id="viewBadge">workspace</span></div><div class="actions"><button class="btn" id="newSearch">Atlas</button><button class="btn" id="openPrinciples">Principes</button><button class="btn" id="fullscreen">Agrandir</button></div></header>
<main class="wrap" id="root"><section class="empty"><div><div class="mark"></div><h2>Le mécanisme, pas le pastiche.</h2><p class="lead">Demande à ChatGPT d’ouvrir l’atlas, de comparer des systèmes, d’analyser une proposition ou de générer trois directions originales.</p></div></section></main>
</div>
<script>
(() => {
  const root = document.getElementById('root');
  const badge = document.getElementById('viewBadge');
  const palette = ['#c9ff39','#ff6238','#586cff','#e6c94d','#7fd1b9','#e98bd1'];
  let current = null;
  // Keep delivery state across same-result renders. A delivered brief is not rendered artwork.
  const nativeHandoffs = new Map();
  const HANDOFF_TIMEOUT_MS = 12000;
  function updateNativeHandoffs(){
    for(const button of root.querySelectorAll('.native-render-route')){
      const route=arr(current?.data?.routes).find(item=>String(item.id)===String(button.dataset.route));
      const state=nativeHandoffs.get(route?.concept_board_prompt);
      const phase=state?.phase||'idle';
      button.dataset.handoffState=phase;
      button.disabled=['pending','sent','uncertain','unavailable'].includes(phase);
      button.setAttribute('aria-busy',String(phase==='pending'));
      const labels={idle:'@Créer une image',pending:'Transmission en cours…',sent:'Demande transmise à la conversation',refused:'Réessayer @Créer une image',uncertain:'Transmission à vérifier',unavailable:'Transmission indisponible'};
      button.textContent=labels[phase];
      let notice=button.parentElement.querySelector('[data-handoff-status]');
      if(!notice){notice=document.createElement('p');notice.className='meta';notice.dataset.handoffStatus='';notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');button.insertAdjacentElement('afterend',notice);}
      notice.textContent=state?.message||'';
    }
  }
  function nativeHandoffState(key,phase,message){
    nativeHandoffs.set(key,{phase,message});updateNativeHandoffs();
  }
  function nativeGenerationPrompt(route){
    return '@Créer une image\n\nUtilise exclusivement l’outil natif « @Créer une image » de ChatGPT pour produire une image à partir de cette direction Infographic Artist. Ne lance aucun moteur externe, aucune API payante ni aucun rendu serveur. Si l’outil natif n’est pas disponible dans cette conversation, explique-le et conserve le brief sans prétendre avoir généré une image. Ne présente pas la transmission du brief comme un rendu terminé.\n\n'+route.concept_board_prompt;
  }
  async function copyNativeBrief(button,route){
    const text=nativeGenerationPrompt(route);
    try{
      if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable');
      await navigator.clipboard.writeText(text);
      button.textContent='Brief copié — à coller dans ChatGPT';
      const note=button.parentElement.querySelector('[data-copy-status]');
      if(note)note.textContent='Le brief est copié. Colle-le dans une conversation ChatGPT pour demander la création avec l’outil natif. Aucune génération n’a été lancée.';
    }catch(_error){
      button.textContent='Copie indisponible';
      const note=button.parentElement.querySelector('[data-copy-status]');
      if(note)note.textContent='Copie non autorisée par cet hôte. Sélectionne et copie manuellement le prompt affiché ci-dessous; aucune demande n’a été envoyée.';
    }
  }
  async function deliverNativeBrief(route){
    const key=route.concept_board_prompt;
    const previous=nativeHandoffs.get(key)?.phase;
    if(['pending','sent','uncertain','unavailable'].includes(previous))return;
    if(!window.openai?.sendFollowUpMessage && !window.openai?.app?.sendMessage && window.parent===window){
      nativeHandoffState(key,'unavailable','Transmission indisponible dans cet hôte. Le brief reste visible ci-dessous; aucune image ni demande de génération n’a été créée.');return;
    }
    nativeHandoffState(key,'pending','Transmission du brief sélectionné. Aucune image n’est encore confirmée.');
    const prompt=nativeGenerationPrompt(route);
    let timer;
    try{
      // Choose one transport, once. Never retry a delivery whose outcome is uncertain.
      const request=window.openai?.sendFollowUpMessage
        ?window.openai.sendFollowUpMessage({prompt})
        :window.openai?.app?.sendMessage
          ?window.openai.app.sendMessage({role:'user',content:[{type:'text',text:prompt}]})
          :bridgeRequest('ui/message',{role:'user',content:[{type:'text',text:prompt}]});
      const reply=await Promise.race([Promise.resolve(request),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('Handoff confirmation timeout')),HANDOFF_TIMEOUT_MS);})]);
      if(reply?.isError===true || reply?.error || reply?.success===false || reply?.accepted===false){
        nativeHandoffState(key,'refused','Transmission refusée par l’hôte. Le brief est conservé. Aucun succès ni aucune image ne sont annoncés.');
      }else{
        nativeHandoffState(key,'sent','Le brief a été transmis. La création effective de l’image doit être confirmée dans la conversation.');
      }
    }catch(_error){
      nativeHandoffState(key,'uncertain','Résultat de transmission incertain : aucune confirmation reçue. Vérifie la conversation avant tout nouvel envoi. Le brief est conservé; aucune nouvelle tentative automatique.');
    }finally{clearTimeout(timer);}
  }
  const esc = (v='') => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const arr = v => Array.isArray(v) ? v : [];
  const pct = v => Math.max(0, Math.min(100, Number(v)||0));
  const pill = v => `<span class="tag">${esc(v)}</span>`;
  const list = (items, empty='Aucun élément') => arr(items).length ? `<ul class="list">${arr(items).map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>` : `<p class="meta">${esc(empty)}</p>`;
  const titleBlock = (eyebrow,title,lead='') => `<section class="hero"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${lead?`<p class="lead">${esc(lead)}</p>`:''}</div></section>`;
  const sourceLinks = sources => arr(sources).length ? `<div class="sources">${arr(sources).map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a>${s.kind?` <span class="meta">· ${esc(s.kind)}</span>`:''}</p>`).join('')}</div>` : '<p class="meta">Aucune source détaillée sur cette fiche index.</p>';

  let bridgeSequence = 0;
  const bridgePending = new Map();
  const bridgeAllowedOrigins = new Set(['https://chatgpt.com','https://chat.openai.com','https://platform.openai.com']);
  function bridgeTargetOrigin(){
    try{
      const origin=new URL(document.referrer).origin;
      if(bridgeAllowedOrigins.has(origin))return origin;
    }catch(_){}
    return 'https://chatgpt.com';
  }
  function bridgeRequest(method,params={},timeoutMs=8000){
    if(window.parent===window) return Promise.reject(new Error('MCP Apps bridge unavailable'));
    const id=`ia-${Date.now()}-${++bridgeSequence}`;
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{bridgePending.delete(id);reject(new Error(`Bridge timeout: ${method}`));},timeoutMs);
      bridgePending.set(id,{resolve,reject,timer});
      window.parent.postMessage({jsonrpc:'2.0',id,method,params},bridgeTargetOrigin());
    });
  }
  async function callTool(name,args){
    try {
      // Prefer an injected host API. Waiting on another bridge first adds 8 seconds in ChatGPT.
      let result;
      if(window.openai?.callTool)result=await window.openai.callTool(name,args);
      else if(window.openai?.app?.callServerTool)result=await window.openai.app.callServerTool({name,arguments:args});
      else result=await bridgeRequest('tools/call',{name,arguments:args});
      if(result?.isError){
        const message=arr(result.content).filter(x=>x.type==='text').map(x=>x.text).join(' ')||'Le serveur a refusé cette demande.';
        showError(new Error(message));return result;
      }
      accept(result);return result;
    }catch(error){
      // Do not repeat an uncertain server call or claim that a follow-up is a completed action.
      showError(error);return null;
    }
  }
  function showError(err){root.innerHTML=`<section class="empty error"><div><h2>Analyse interrompue</h2><p>${esc(err?.message||err)}</p></div></section>`;}
  function setLoading(label='Analyse en cours'){root.innerHTML=`<section class="empty"><div><div class="spinner"></div><h2>${esc(label)}</h2></div></section>`;}

  function renderAtlas(d){
    const s=d.summary||{}; const items=arr(d.items);
    root.innerHTML = titleBlock('Atlas interrogeable', d.query?`Résultats · ${d.query}`:'934 identités iconiques', `${d.total_matches ?? items.length} correspondances. Les 64 monographies profondes sont distinguées des fiches d’index.`)+
      `<section class="stats"><div class="stat"><b>${esc(s.brand_count||934)}</b>identités</div><div class="stat"><b>${esc(s.deep_case_count||64)}</b>monographies</div><div class="stat"><b>${esc(s.library_count||105)}</b>systèmes</div><div class="stat"><b>${esc(s.graph_nodes||159)}</b>nœuds</div></section>`+
      `<section class="grid">${items.map((x,i)=>`<article class="card" style="--card-accent:${palette[i%palette.length]}"><div class="eyebrow">${esc(x.region)} · ${esc(x.depth)}</div><h3>${esc(x.name)}</h3><p class="meta">${esc(x.organization||x.category)}${x.year?` · ${esc(x.year)}`:''}</p><p>${esc(x.lesson||x.why_iconic)}</p><div class="tags">${[x.system_pattern,x.primary_mechanism,x.evidence].filter(Boolean).map(pill).join('')}</div><div class="footer"><button class="btn open-case" data-id="${esc(x.id)}">Ouvrir</button></div></article>`).join('')}</section>`;
    document.querySelectorAll('.open-case').forEach(b=>b.addEventListener('click',()=>{setLoading('Ouverture de la fiche');callTool('get_brand_case',{item_id:b.dataset.id});}));
  }
  function renderCase(d){
    root.innerHTML=titleBlock(`${d.region||''} · ${d.evidence||''}`,d.name,d.why_iconic||d.lesson)+
      `<div class="notice"><strong>Frontière anti-copie.</strong> ${esc(d.do_not_copy||'Re-dériver la forme depuis le brief.')}</div>`+
      `<section class="compare"><article class="card"><div class="eyebrow">Mécanisme</div><h3>${esc(d.primary_mechanism||d.system_pattern)}</h3><p>${esc(d.visual_mechanism||d.lesson)}</p><div class="tags">${[d.category,d.archetype,d.system_pattern].filter(Boolean).map(pill).join('')}</div></article><article class="card"><div class="eyebrow">Contexte</div><h3>${esc(d.organization||d.name)}</h3><p>${esc(d.year||'Date à vérifier')}</p><p>${arr(d.designers).map(esc).join(', ')||'Attribution non détaillée'}</p><p class="meta">Sensibilité juridique : ${esc(d.legal_sensitivity||'standard')}</p></article></section>`+
      `<section class="section"><div class="section-title"><h2>Principes transférables</h2></div>${list(d.principles)}</section>`+
      `<section class="compare"><div><h2>Base de reconnaissance</h2>${list(d.recognition_basis)}</div><div><h2>Tests de résistance</h2>${list(d.stress_tests)}</div></section>`+
      `<section class="section"><div class="section-title"><h2>Sources</h2></div>${sourceLinks(d.sources)}</section>`;
  }
  function renderComparison(d){
    const cases=arr(d.cases);
    root.innerHTML=titleBlock('Lecture croisée',`${cases.length} systèmes comparés`,d.synthesis)+
      `<div class="notice"><strong>Règle.</strong> Transférer la logique partagée seulement après avoir changé silhouette, topologie, typographie, comportement chromatique et composition.</div>`+
      `<section class="matrix"><table><thead><tr><th>Identité</th><th>Pattern</th><th>Mécanisme</th><th>Principes</th><th>Collision</th><th>Tests</th></tr></thead><tbody>${cases.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.pattern)}</td><td>${esc(c.mechanism)}</td><td>${arr(c.principles).map(esc).join('<br>')}</td><td>${esc(c.collision_boundary)}</td><td>${arr(c.stress_tests).map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></section>`+
      `<section class="compare"><article class="card"><h3>Patrons partagés</h3>${list(d.shared_patterns)}</article><article class="card"><h3>Mécanismes partagés</h3>${list(d.shared_mechanisms)}</article></section>`;
  }
  function renderGraph(d){
    const nodes=arr(d.nodes), edges=arr(d.edges), byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
    if(!nodes.length){
      root.innerHTML=titleBlock('Knowledge graph',d.query?'Réseau · '+d.query:'Mécanismes et systèmes','0 nœuds · 0 relations')+'<p class="notice">Aucun nœud ne correspond à cette recherche. Aucun résultat sans rapport n’a été substitué.</p>';
      return;
    }
    const W=1000,H=560,pad=42;
    const xy=n=>({x:pad+(Number(n.x)||.5)*(W-pad*2),y:pad+(Number(n.y)||.5)*(H-pad*2)});
    const lines=edges.map(e=>{const a=byId[e.source],b=byId[e.target]; if(!a||!b)return '';const A=xy(a),B=xy(b);return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#f2efe626" stroke-width="1"/>`;}).join('');
    const dots=nodes.map((n,i)=>{const p=xy(n),r=Math.max(4,Math.min(12,4+(Number(n.degree)||0)/6));return `<g><circle class="graph-node" cx="${p.x}" cy="${p.y}" r="${r}" fill="${palette[i%palette.length]}" data-label="${esc(n.label)}"><title>${esc(n.label)} · ${esc(n.type)}</title></circle><text class="graph-label" x="${p.x+r+4}" y="${p.y+4}">${esc(String(n.label).slice(0,28))}</text></g>`;}).join('');
    root.innerHTML=titleBlock('Knowledge graph',d.query?`Réseau · ${d.query}`:'Mécanismes et systèmes',`${d.meta?.node_count||nodes.length} nœuds · ${d.meta?.edge_count||edges.length} relations`)+`<section class="graphbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphe des systèmes de marque">${lines}${dots}</svg></section><p class="meta">Le graphe montre des relations abstraites et des précédents de méthode; il ne contient aucun artwork de tiers.</p>`;
  }
  const workflowLabels = {non_testé:'Non testé',satisfait:'Satisfait',écart:'Écart',indéterminé:'Indéterminé',non_applicable:'Non applicable'};
  const briefLabels = {name:'Projet',task:'Tâche',audience:'Public',message:'Message',medium:'Support',final_size:'Taille finale',cultural_context:'Contexte culturel',sector:'Secteur',promise:'Promesse'};
  function designWorkflowBlock(w){
    if(!w || !arr(w.stages).length)return '';
    const outcomes=w.evaluations||{};
    const missing=arr(w.missing_brief);
    const brief_display=Object.entries(w.brief||{}).filter(([,value])=>typeof value==='string'&&value.trim());
    return '<section class="section design-workflow" aria-labelledby="workflow-title"><div class="section-title"><div><div class="eyebrow">Parcours de conception</div><h2 id="workflow-title">Huit étapes, des preuves distinctes</h2></div></div>'+
      '<p class="lead">Ce parcours prépare les décisions et les contrôles. Les résultats restent non testés tant que leurs preuves ne sont pas recueillies.</p>'+
      (brief_display.length?'<div class="workflow-brief"><h3>Brief déclaré</h3><dl>'+brief_display.map(([key,value])=>'<dt>'+esc(briefLabels[key]||key)+'</dt><dd>'+esc(value)+'</dd>').join('')+'</dl></div>':'')+
      (missing.length?'<div class="notice"><strong>Brief à compléter.</strong> '+missing.map(k=>esc(briefLabels[k]||k)).join(' · ')+'</div>':'')+
      '<ol class="workflow-stages">'+w.stages.map((s,i)=>'<li><details class="workflow-stage" data-workflow-stage="'+esc(s.id)+'"'+(i===0?' open':'')+'><summary><span class="workflow-number">'+(i+1)+'</span><span>'+esc(s.title)+'</span><span class="tag">'+esc(workflowLabels[s.status]||s.status||'Non testé')+'</span></summary><div class="workflow-body">'+
      (s.objective?'<p>'+esc(s.objective)+'</p>':'')+
      '<h3>Livrable attendu</h3>'+list(s.deliverables,'À préciser selon le brief')+
      '<h3>Contrôles à effectuer</h3>'+list(s.checks,'À définir selon le support')+
      (arr(s.principle_ids).length?'<p class="meta">Fiches de référence : '+s.principle_ids.map(esc).join(' · ')+'</p>':'')+
      '</div></details></li>').join('')+'</ol>'+
      '<h3>Évaluation auprès du public</h3><div class="grid workflow-outcomes">'+[['recognition','Reconnaissance'],['comprehension','Compréhension'],['preference','Préférence']].map(([key,label])=>'<article class="card" data-evaluation="'+key+'"><div class="eyebrow">'+esc(workflowLabels[outcomes[key]?.status]||outcomes[key]?.status||'Non testé')+'</div><h3>'+label+'</h3><p>'+esc(outcomes[key]?.method||outcomes[key]?.question||'Définir une tâche et recueillir les réponses du public visé.')+'</p></article>').join('')+'</div>'+
      '<p class="meta">Un calcul, une inspection du rendu et un essai auprès de personnes répondent à des questions différentes. La préférence ne compense pas une représentation inexacte.</p></section>';
  }
  function principleSources(items){
    return arr(items).map(s=>{
      const url=/^https?:\/\//i.test(String(s.url||''))?s.url:'';
      const scope=s.read_level||s.reading||'Portée de lecture non renseignée dans le catalogue.';
      const scopeStatus=s.read_scope_status||((s.read_level||s.reading)?'documented':'not_recorded');
      const scopeLabel={documented:'Documentée',not_recorded:'Non renseignée'}[scopeStatus]||scopeStatus;
      return '<div class="sources"><p>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title||url)+'</a>':esc(s.title||s.id||''))+'</p>'+(s.supports?'<p class="meta">'+esc(s.supports)+'</p>':'')+'<p class="meta" data-read-scope-status="'+esc(scopeStatus)+'"><strong>Portée de lecture · '+esc(scopeLabel)+'</strong><br>'+esc(scope)+'</p></div>';
    }).join('');
  }
  function renderPrinciples(d){
    const items=arr(d.items),count=d.total_matches??items.length;
    root.innerHTML=titleBlock('Référentiel de conception',d.query?'Principes · '+d.query:'Géométrie, perception et design',count+' correspondances · '+items.length+' fiches affichées')+
      '<form class="principle-search" id="principleSearch"><label for="principleQuery">Chercher une notion, un identifiant ou un domaine</label><div><input id="principleQuery" name="query" maxlength="300" value="'+esc(d.query||'')+'" placeholder="Nombre d’or, Gestalt, données…"><button class="btn" type="submit">Rechercher</button></div></form>'+
      '<p class="meta">150 notions dans 14 domaines, documentées par 69 références. Les applications proposées restent à vérifier selon le contexte. Une propriété mathématique ne démontre pas une supériorité esthétique.</p>'+
      (count>items.length?'<p class="meta">Précise la recherche pour consulter les autres fiches.</p>':'')+
      (items.length?'<section class="grid">'+items.map(x=>'<article class="card principle-card"><div class="eyebrow">'+esc(x.id)+' · '+esc(x.domain_label||x.domain)+'</div><h3>'+esc(x.name)+'</h3><div class="tags">'+pill(x.basis_label||x.basis)+'</div><p>'+esc(x.definition)+'</p><p><strong>Application proposée</strong><br>'+esc(x.application)+'</p><details><summary>Limites, formule et sources</summary><p>'+esc(x.limits)+'</p>'+(x.formula?'<pre class="prompt">'+esc(x.formula)+'</pre>':'')+principleSources(x.sources||x.references)+'</details></article>').join('')+'</section>':'<p class="notice">Aucune fiche ne correspond à cette recherche.</p>');
  }
  function renderLibrary(d){
    if(d.collection==='design_principles')return renderPrinciples(d);
    root.innerHTML=titleBlock('Bibliothèque de systèmes',d.query?`Méthodes · ${d.query}`:'Studios, manuels et écoles',`${d.total_matches||arr(d.items).length} correspondances`)+`<section class="grid">${arr(d.items).map((x,i)=>`<article class="card" style="--card-accent:${palette[i%palette.length]}"><div class="eyebrow">${esc(x.kind)} · ${esc(x.region)}</div><h3>${esc(x.name)}</h3><p class="meta">${esc(x.era)}</p><div class="tags">${arr(x.focus).map(pill).join('')}</div><p><strong>Principes</strong><br>${arr(x.principles).map(esc).join(' · ')}</p><p class="meta">${arr(x.signature_projects).map(esc).join(' · ')}</p></article>`).join('')}</section>`;
  }
  function renderDirections(d){
    const b=d.brief||{};
    const h=d.image_generation_handoff||{};
    root.innerHTML=titleBlock('Brief → système',b.name||'Directions originales',`${b.sector||''} · ${b.promise||''}`)+`<div class="notice"><strong>Décision.</strong> ${esc(d.decision_rule)}</div>${h.instructions?`<div class="notice"><strong>Création des images.</strong> ${esc(h.instructions)} ${h.storage_note?esc(h.storage_note):''}</div>`:''}<section class="route-grid">${arr(d.routes).map(r=>`<article class="route"><div class="eyebrow">Route ${esc(r.id)}</div><h3>${esc(r.name)}</h3><p><strong>${esc(r.thesis)}</strong></p><p>${esc(r.architecture)}</p><button class="btn native-render-route" data-route="${esc(r.id)}">@Créer une image</button><button class="btn copy-native-brief" data-route="${esc(r.id)}" aria-label="Copier le brief complet pour la génération native">Copier le brief pour ChatGPT</button><p class="meta" role="status" aria-live="polite" data-copy-status></p><h4>Géométrie</h4><p>${esc(r.geometry)}</p><h4>Typographie</h4><p>${esc(r.typography)}</p><h4>Actifs</h4><div class="tags">${arr(r.assets).map(pill).join('')}</div><h4>Prompt concept board</h4><pre class="prompt">${esc(r.concept_board_prompt||'')}</pre><h4>Évaluation</h4>${list(r.board_evaluation_focus)}<h4>Tests</h4>${list(r.stress_tests)}<div class="notice"><strong>Anti-copie.</strong> ${esc(r.anti_copy_rule)}</div><p class="meta">Précédents de principe : ${arr(r.precedents).map(p=>esc(p.name)).join(' · ')||'aucun'}</p></article>`).join('')}</section>`;
  }
  let renderPollTimer = null;
  let renderPollJob = '';
  let renderPollCount = 0;
  function clearRenderPoll(){
    if(renderPollTimer){clearTimeout(renderPollTimer);renderPollTimer=null;}
  }
  function scheduleRenderPoll(d){
    if(!d?.job_id || !['queued','running'].includes(String(d.status||'')))return;
    if(renderPollJob!==d.job_id){renderPollJob=d.job_id;renderPollCount=0;}
    if(renderPollCount>=40)return;
    renderPollTimer=setTimeout(async()=>{
      renderPollTimer=null;
      renderPollCount++;
      await callTool('get_render_job',{job_id:d.job_id});
    },2500);
  }
  function renderAssetGrid(d){
    const assets=arr(d.assets);
    if(!assets.length)return '<section class="empty"><div><div class="spinner"></div><h2>Rendu en cours</h2><p class="lead">Rafraîchis le statut pour récupérer les planches générées.</p></div></section>';
    return `<section class="asset-grid">${assets.map(a=>{const hasDims=Number.isFinite(Number(a.width))&&Number(a.width)>0&&Number.isFinite(Number(a.height))&&Number(a.height)>0;const dims=hasDims?`${esc(a.width)}×${esc(a.height)}`:'dimensions non disponibles';return `<article class="asset"><img src="${esc(a.asset_url)}" alt="${esc(a.route_name||'Generated concept board')}" loading="lazy"><div class="asset-body"><div class="eyebrow">${esc(a.route_id)}</div><h3>${esc(a.route_name||'Concept board')}</h3><p class="meta">${dims} · ${esc(a.mime_type)} · ${esc(Math.round((Number(a.bytes)||0)/1024))} KB</p></div></article>`}).join('')}</section>`;
  }
  function renderEvaluations(d){
    const evaluations=arr(d.evaluations);
    if(!evaluations.length)return '';
    return `<section class="section"><div class="section-title"><h2>Évaluation</h2></div><div class="grid">${evaluations.map(e=>{const c=e.critique||{};return `<article class="card"><div class="eyebrow">${esc(e.route_id)}</div><h3>Indice heuristique · ${esc(c.score ?? '—')}/${esc(c.score_max ?? 100)}</h3>${list(c.priority_actions,'Aucune action prioritaire')}</article>`}).join('')}</div></section>`;
  }
  function renderRenderJob(d){
    const p=d.progress||{};
    const expires=d.expires_at?new Date(d.expires_at).toLocaleString():'';
    root.innerHTML=titleBlock(d.kind==='workflow'?'Workflow de rendu':'Rendu de direction',d.job_id||'Render job',`${d.provider||''} · ${d.options?.model||''}`)+`<div class="section-title"><span class="status-pill" data-status="${esc(d.status)}">${esc(d.status||'queued')}</span><button class="btn refresh-render" data-job="${esc(d.job_id)}">Rafraîchir</button></div><section class="job-meta"><div class="stat"><b>${esc(p.completed ?? 0)}/${esc(p.total ?? 1)}</b>progression</div><div class="stat"><b>${esc(d.options?.size||'')}</b>format</div><div class="stat"><b>${esc(d.options?.quality||'')}</b>qualité</div><div class="stat"><b>${esc(expires)}</b>expiration</div></section>${d.error?`<div class="notice error"><strong>Erreur.</strong> ${esc(d.error)}</div>`:''}${d.provider_note?`<p class="meta">${esc(d.provider_note)}</p>`:''}${renderAssetGrid(d)}${renderEvaluations(d)}`;
    scheduleRenderPoll(d);
  }
  function renderWorkflow(d){renderRenderJob(d);}
  function renderCritique(d){
    const axes=Object.entries(d.axes||{});
    const maximum=Number.isFinite(d.score_max)?d.score_max:100;
    const title=(maximum===100?'Indice heuristique':'Sous-total technique')+' · '+(d.score??'—')+'/'+maximum;
    const rows=axes.map(([key,a])=>{
      const available=Number.isFinite(a.score)&&a.status!=='non_evaluable';
      return `<div class="axis" data-axis="${esc(key)}" data-axis-status="${available?'heuristic':'non_evaluable'}"><strong>${esc(a.label)}</strong>`+
        (available?`<div class="track"><div class="fill" style="width:${pct((a.score/20)*100)}%"></div></div><b>${esc(a.score)}/20</b>`:
        `<span class="axis-unavailable"><strong>Non évaluable</strong><br><span class="meta">${esc(a.measurement_note||'Référence comparative requise.')}</span></span>`)+`</div>`;
    }).join('');
    root.innerHTML=titleBlock('Repères techniques',title,d.context||'Mesures techniques pour orienter la prochaine inspection. Les résultats auprès du public ne sont pas testés par cet indice.')+
      `<section class="bars">${rows}</section><section class="section"><div class="section-title"><h2>Actions prioritaires</h2></div>${list(d.priority_actions)}</section>${d.reference_comparison?similarityBlock(d.reference_comparison):''}<div class="notice"><strong>Limite.</strong> ${esc(d.method_note)}</div>`;
  }
  function similarityBlock(d){return `<section class="section"><div class="section-title"><h2>Risque perceptuel · ${esc(d.risk_band)}</h2><strong>${esc(d.risk_score)}/100</strong></div><div class="gauge"><i style="left:${pct(d.risk_score)}%"></i></div><div class="grid" style="margin-top:12px">${Object.entries(d.components||{}).map(([k,v])=>`<article class="card" style="min-height:130px"><div class="eyebrow">${esc(k.replaceAll('_',' '))}</div><h3>${esc(v)}%</h3></article>`).join('')}</div><h3>Transformations structurelles</h3>${list(d.recommended_transformations)}<div class="notice"><strong>Juridique.</strong> ${esc(d.legal_note)}</div></section>`;}
  function renderSimilarity(d){root.innerHTML=titleBlock('Triage de similarité',`${d.risk_score}/100 · ${d.risk_band}`,'La proximité visuelle est décomposée pour montrer où agir, au lieu de fournir un verdict opaque.')+similarityBlock(d);}
  function renderCoach(d){root.innerHTML=titleBlock('Mode coach','Une décision falsifiable',d.diagnosis)+`<section class="coach"><article class="coach-panel"><div class="eyebrow">Pourquoi</div><h3>${esc(d.goal)}</h3><p>${esc(d.why)}</p><div class="notice"><strong>Règle de coach.</strong> ${esc(d.coach_rule)}</div></article><article class="coach-panel"><div class="eyebrow">Exercice · ${esc(d.exercise?.duration)}</div><h3>${esc(d.question)}</h3>${arr(d.exercise?.schedule).length?'<div data-coach-schedule>'+list(d.exercise.schedule.map(step=>step.minutes+' min · '+step.task))+'</div>':list(d.exercise?.steps)}<h3>Critères d’acceptation</h3>${list(d.acceptance_criteria)}</article></section>`;}
  function render(payload){
    clearRenderPoll();
    current=payload; const view=payload?.view||'workspace'; const d=payload?.data||{}; badge.textContent=view;
    const f={atlas:renderAtlas,case:renderCase,comparison:renderComparison,graph:renderGraph,library:renderLibrary,directions:renderDirections,render_job:renderRenderJob,render_workflow:renderWorkflow,critique:renderCritique,similarity:renderSimilarity,coach:renderCoach}[view];
    if(f){f(d);if(d.design_workflow)root.insertAdjacentHTML('beforeend',designWorkflowBlock(d.design_workflow));} else root.innerHTML=`<section class="empty"><div><h2>Résultat reçu</h2><pre>${esc(JSON.stringify(payload,null,2))}</pre></div></section>`;
    if(view==='directions')updateNativeHandoffs();
  }
  function extract(x){
    if(!x)return null;
    if(x.view&&x.data)return x;
    if(x.structuredContent?.view)return x.structuredContent;
    if(x.toolOutput?.view)return x.toolOutput;
    if(x.result?.structuredContent?.view)return x.result.structuredContent;
    if(x.params?.structuredContent?.view)return x.params.structuredContent;
    if(x.params?.result?.structuredContent?.view)return x.params.result.structuredContent;
    return null;
  }
  function accept(x){const p=extract(x);if(p)render(p);}
  window.addEventListener('message',e=>{
    if(e.source!==window.parent || !bridgeAllowedOrigins.has(e.origin))return;
    const d=e.data;
    if(d?.jsonrpc==='2.0'&&d.id&&bridgePending.has(d.id)){
      const pending=bridgePending.get(d.id);bridgePending.delete(d.id);clearTimeout(pending.timer);
      if(d.error)pending.reject(new Error(d.error.message||'Bridge request failed'));else pending.resolve(d.result);
      return;
    }
    if(d?.method==='ui/notifications/tool-result'||d?.method==='openai:set_globals'||d?.type==='openai:set_globals')accept(d);
  });
  window.addEventListener('openai:set_globals',e=>accept(e.detail));
  root.addEventListener('click',async e=>{
    const refresh=e.target.closest?.('.refresh-render');
    if(refresh){setLoading('Actualisation du rendu');await callTool('get_render_job',{job_id:refresh.dataset.job});return;}
    const copyBtn=e.target.closest?.('.copy-native-brief');
    if(copyBtn){
      const route=arr(current?.data?.routes).find(x=>String(x.id)===String(copyBtn.dataset.route));
      if(route?.concept_board_prompt)await copyNativeBrief(copyBtn,route);
      return;
    }
    const nativeBtn=e.target.closest?.('.native-render-route');
    if(nativeBtn){
      const route=arr(current?.data?.routes).find(x=>String(x.id)===String(nativeBtn.dataset.route));
      if(!route?.concept_board_prompt)return;
      await deliverNativeBrief(route);
      return;
    }
    const renderBtn=e.target.closest?.('.render-route');
    if(renderBtn){
      const routes=arr(current?.data?.routes);
      const route=routes.find(x=>String(x.id)===String(renderBtn.dataset.route));
      if(route){setLoading('Démarrage du rendu');await callTool('render_brand_direction',{route,brief:current.data.brief||{}});}
      return;
    }
    const link=e.target.closest?.('.sources a');if(!link)return;
    const href=link.href;if(!href)return;
    if(window.openai?.openExternal){e.preventDefault();await window.openai.openExternal({href});}
  });
  root.addEventListener('submit',async e=>{
    if(e.target.id!=='principleSearch')return;
    e.preventDefault();const query=e.target.elements.query.value;setLoading('Recherche des principes');
    await callTool('search_design_systems',{query,kind:'principle',limit:12});
  });
  document.getElementById('newSearch').addEventListener('click',()=>callTool('open_brand_atlas',{query:'',limit:12}));
  document.getElementById('openPrinciples').addEventListener('click',()=>callTool('search_design_systems',{query:'',kind:'principle',limit:12}));
  document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(window.openai?.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'});else if(window.openai?.app?.requestDisplayMode)await window.openai.app.requestDisplayMode({mode:'fullscreen'});}catch(_){}});
  const initial = extract(window.__INFOGRAPHIC_DEMO__) || extract(window.openai) || extract(window.openai?.toolOutput) || extract(window.openai?.toolResult);
  if(initial) render(initial);
})();
</script>
</body>
</html>
